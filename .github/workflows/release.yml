name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  # Strips the leading "v" from a tag like v1.2.0 so it's a valid jpackage/semver version.
  CASTCLI_VERSION: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Strip leading v from tag for version property
        run: echo "CASTCLI_VERSION=${CASTCLI_VERSION#v}" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./gradlew test

      - name: Build distribution archives
        run: ./gradlew installDist distZip distTar cyclonedxBom -PcastcliVersion="$CASTCLI_VERSION"

      - name: Add SBOM and checksums
        run: |
          cp build/reports/cyclonedx/bom.json "build/distributions/cast-cli-${CASTCLI_VERSION}-sbom.cdx.json"
          cp build/reports/cyclonedx/bom.xml "build/distributions/cast-cli-${CASTCLI_VERSION}-sbom.cdx.xml"
          cd build/distributions
          sha256sum *.zip *.tar *.json *.xml > SHA256SUMS

      - name: Attest distribution archives and SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            build/distributions/*.zip
            build/distributions/*.tar
            build/distributions/*-sbom.cdx.json
            build/distributions/*-sbom.cdx.xml
            build/distributions/SHA256SUMS

      - name: Verify local CLI config validate command
        run: ./build/install/cast-cli/bin/cast-cli --config config/harness.example.json config validate

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Lowercase repository name for image tags
        # Docker/OCI image references must be all-lowercase; github.repository preserves case.
        run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_REPO }}:latest

      - name: Attest container image
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            build/distributions/*.zip
            build/distributions/*.tar
            build/distributions/*-sbom.cdx.json
            build/distributions/*-sbom.cdx.xml
            build/distributions/SHA256SUMS
          generate_release_notes: true

  native-bundles:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cast-cli-linux-x64
          - os: windows-latest
            asset: cast-cli-windows-x64
          - os: macos-latest
            asset: cast-cli-macos-arm64
          - os: macos-13
            asset: cast-cli-macos-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Strip leading v from tag for version property
        shell: bash
        run: echo "CASTCLI_VERSION=${CASTCLI_VERSION#v}" >> "$GITHUB_ENV"

      # Each platform ships a distinct app image, so verify the suite passes here too --
      # the ubuntu-only run in the `release` job doesn't cover Windows/macOS-specific behavior.
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat test

      # No host Java required to run the resulting bundle -- jpackage embeds a jlinked JRE.
      - name: Build self-contained app image (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew jpackageImage -PcastcliVersion="$CASTCLI_VERSION"

      - name: Build self-contained app image (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat jpackageImage "-PcastcliVersion=$env:CASTCLI_VERSION"

      - name: Zip app image (Unix)
        if: runner.os != 'Windows'
        # jpackage's app-image output is a plain "cast-cli" directory on Linux, but a
        # "cast-cli.app" bundle on macOS.
        run: |
          cd build/jpackage
          if [ -d "cast-cli.app" ]; then
            zip -r ../../${{ matrix.asset }}.zip cast-cli.app
          else
            zip -r ../../${{ matrix.asset }}.zip cast-cli
          fi

      - name: Zip app image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/jpackage/cast-cli -DestinationPath ${{ matrix.asset }}.zip

      - name: Write checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 "${{ matrix.asset }}.zip" > "${{ matrix.asset }}.zip.sha256"

      - name: Write checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.asset }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Set-Content "${{ matrix.asset }}.zip.sha256"

      - name: Attest native bundle
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256

      - name: Upload bundle to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256
