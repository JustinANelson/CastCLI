name: CastCLI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ runner.os != 'Windows' && 'gradle' || '' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit & integration tests with static analysis
        run: ./gradlew check test checkstyleMain checkstyleTest --info

      - name: Verify JaCoCo coverage
        run: ./gradlew jacocoTestCoverageVerification

      - name: Archive JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-coverage-report-${{ matrix.os }}
          path: build/reports/jacoco/test/html/

      - name: Build distribution package
        run: ./gradlew installDist

      - name: Test local CLI config validate command
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/install/cast-cli/bin/cast-cli.bat --config config/harness.example.json config validate
          else
            ./build/install/cast-cli/bin/cast-cli --config config/harness.example.json config validate
          fi

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        run: docker buildx build --load -t cast-cli:latest .

      - name: Test Docker container doctor check and config validate
        run: |
          docker run --rm cast-cli:latest doctor --json
          docker run --rm cast-cli:latest --config config/harness.example.json config validate --json

      - name: Verify Docker health check
        run: |
          id=$(docker run -dit --rm cast-cli:latest mcp-serve)
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 12); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$id")
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && docker inspect "$id" && exit 1
            sleep 5
          done
          docker inspect "$id"
          exit 1
