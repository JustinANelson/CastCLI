# Copy this table into a trusted project's .codex/config.toml or your global Codex config.
# Replace both absolute paths for your machine, then restart Codex and run /mcp.
[mcp_servers.cast-cli]
enabled = true
required = true
command = "C:\absolute\path\to\CastCLI\build\install\cast-cli\bin\cast-cli.bat"
args = ["--config", "C:\absolute\path\to\CastCLI\config\harness.local.json", "mcp-serve"]
startup_timeout_sec = 20.0
tool_timeout_sec = 75.0
enabled_tools = [
  "ask_local",
  "list_models",
  "read_workspace_file",
  "list_workspace_files",
  "search_workspace",
  "remember_context",
  "recall_context"
]
